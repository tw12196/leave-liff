<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>แจ้งปฏิบัติงานนอกสถานที่</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17262b;
    --ink-soft: #5b6b70;
    --line: #e4e9ea;
    --paper: #f6f8f8;
    --card: #ffffff;
    --purple: #7856a8;
    --purple-deep: #5c4184;
    --purple-tint: #efe9f6;
    --danger: #c05656;
    --danger-tint: #f8e9e9;
    --amber: #c98a3a;
    --amber-tint: #fbf0e2;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Sarabun', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }

  .state-screen {
    min-height: 70vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 10px;
    color: var(--ink-soft);
  }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--purple);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 4px 2px 18px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--purple-tint); border: 1px solid var(--line); object-fit: cover; }
  .who .name { font-weight: 600; font-size: 16px; line-height: 1.2; }
  .who .dept { font-size: 12.5px; color: var(--ink-soft); }

  .section-label { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--ink-soft); margin: 22px 2px 10px; text-transform: uppercase; }

  .date-card {
    background: linear-gradient(135deg, var(--purple), var(--purple-deep));
    border-radius: var(--radius); padding: 18px; color: #fff;
  }
  .date-card .label { font-size: 12.5px; opacity: .85; }
  .date-card .value { font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-top: 6px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }

  .day-type-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .day-type-opt {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 8px; text-align: center;
    font-size: 14px; color: var(--ink-soft); cursor: pointer; font-weight: 500;
  }
  .day-type-opt.active { border-color: var(--purple); color: var(--purple-deep); background: var(--purple-tint); font-weight: 600; }

  .time-range-row { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .time-range-row.show { display: grid; }
  .time-range-row .field { margin-bottom: 0; }

  input[type="time"] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 12px; font-size: 15px; font-family: inherit;
    color: var(--ink); background: #fff;
  }
  input[type="time"]:focus, textarea:focus { outline: none; border-color: var(--purple); }

  textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; color: var(--ink); background: #fff; resize: vertical; min-height: 80px; }

  .submit-btn { width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px; background: var(--purple); color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .submit-btn:active { background: var(--purple-deep); }
  .submit-btn:disabled { background: #c3b8d6; }

  .banner { border-radius: 12px; padding: 13px 14px; font-size: 13.5px; margin-top: 14px; line-height: 1.5; white-space: pre-line; }
  .banner.success { background: var(--purple-tint); color: var(--purple-deep); }
  .banner.error { background: var(--danger-tint); color: var(--danger); }
  .banner.warning { background: var(--amber-tint); color: var(--amber); }

  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .done-screen .icon { font-size: 40px; }
  .done-screen .msg { font-size: 15px; color: var(--ink); line-height: 1.6; max-width: 320px; }
</style>
</head>
<body>
<div id="app">
  <div id="loadingScreen" class="state-screen">
    <div class="spinner"></div>
    <div>กำลังโหลดข้อมูลค่ะ...</div>
    <div class="status-text" id="statusText"></div>
  </div>

  <div id="errorScreen" class="state-screen" style="display:none;">
    <div style="font-size:28px;">⚠️</div>
    <div id="errorMessage">เกิดข้อผิดพลาด</div>
  </div>

  <div id="doneScreen" class="state-screen done-screen" style="display:none;">
    <div class="icon" id="doneIcon">✅</div>
    <div class="msg" id="doneMessage"></div>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="topbar">
      <img id="avatar" class="avatar" src="" alt="">
      <div class="who">
        <div class="name" id="empName">-</div>
        <div class="dept">แจ้งปฏิบัติงานนอกสถานที่</div>
      </div>
    </div>

    <div class="section-label">วันที่ไม่พบข้อมูลสแกนนิ้ว</div>
    <div class="date-card">
      <div class="label">วันที่</div>
      <div class="value" id="dateDisplay">-</div>
    </div>

    <div class="section-label">รายละเอียดการปฏิบัติงานนอกสถานที่</div>
    <div class="card">
      <div class="field">
        <label>ลักษณะการปฏิบัติงาน</label>
        <div class="day-type-row" id="dayTypeRow">
          <div class="day-type-opt active" data-type="full">เต็มวัน</div>
          <div class="day-type-opt" data-type="range">ระบุช่วงเวลา</div>
        </div>
        <div class="time-range-row" id="timeRangeRow">
          <div class="field">
            <label>เวลาเริ่ม</label>
            <input type="time" id="startTime" value="08:30">
          </div>
          <div class="field">
            <label>เวลาสิ้นสุด</label>
            <input type="time" id="endTime" value="17:00">
          </div>
        </div>
      </div>

      <div class="field">
        <label>สถานที่ / รายละเอียดการปฏิบัติงาน <span style="color:var(--danger);">*</span></label>
        <textarea id="remark" placeholder="เช่น ไปพบลูกค้าที่บริษัท ABC, ออกตรวจหน้างานที่..." required></textarea>
      </div>

      <button class="submit-btn" id="submitBtn">ส่งรายงาน</button>
      <div id="resultBanner"></div>
      <div class="hint">ระบบจะส่งเรื่องนี้ให้หัวหน้างาน/ผู้จัดการของท่านพิจารณาอนุมัติต่อไปค่ะ</div>
    </div>
  </div>
</div>

<script>
  // ===== ค่าที่ต้องตั้ง =====
  const LIFF_ID = '2010663561-4ovJMpxr';
  const API_URL = 'https://script.google.com/macros/s/AKfycby4eYabeQ6xJ-60NtHE9QoRh6LKK6-l0IMf399bgSZ1EYIMRvaarHZqDiJO6KS_Xrla8g/exec';
  // ==========================

  window.onerror = function (message) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('errorScreen').style.display = '';
    document.getElementById('errorMessage').innerHTML =
      'พบข้อผิดพลาดในหน้าเว็บ:<br><span style="font-size:12px;word-break:break-all;">' + message + '</span>';
    return true;
  };

  let profile = null;
  let aid = '';
  let dateStr = '';
  let dayType = 'full';

  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
  }

  function setStatus(msg) {
    const el = document.getElementById('statusText');
    if (el) el.textContent = msg;
  }

  function showScreen(id) {
    ['loadingScreen', 'errorScreen', 'mainScreen', 'doneScreen'].forEach(function (s) {
      document.getElementById(s).style.display = (s === id) ? '' : 'none';
    });
  }

  function showError(msg) {
    document.getElementById('errorMessage').textContent = msg;
    showScreen('errorScreen');
  }

  function isTokenExpiredError(msg) {
    return /access token/i.test(msg) && /expired/i.test(msg);
  }

  function init() {
    aid = getQueryParam('aid');
    dateStr = getQueryParam('date');

    if (!aid) {
      showError('ไม่พบรหัสรายการ กรุณาเปิดลิงก์นี้จากการ์ดในไลน์อีกครั้งค่ะ');
      return;
    }

    document.getElementById('dateDisplay').textContent = dateStr || '-';

    setStatus('เช็ก LIFF SDK...');
    if (typeof liff === 'undefined') {
      showError('โหลด LINE LIFF SDK ไม่สำเร็จ กรุณาเช็กการเชื่อมต่ออินเทอร์เน็ต แล้วลองเปิดใหม่อีกครั้งค่ะ');
      return;
    }
    setStatus('SDK พร้อม กำลัง liff.init()...');
    const stallTimer = setTimeout(function () {
      showError('การเชื่อมต่อกับ LINE ใช้เวลานานผิดปกติ กรุณาลองปิดแล้วเปิดหน้านี้ใหม่อีกครั้งค่ะ');
    }, 12000);

    liff.init({ liffId: LIFF_ID }).then(function () {
      clearTimeout(stallTimer);
      setStatus('init สำเร็จ กำลังเช็กสถานะล็อกอิน...');
      if (!liff.isLoggedIn()) {
        setStatus('ยังไม่ได้ล็อกอิน กำลังนำไปหน้า login...');
        liff.login();
        return;
      }
      setStatus('ล็อกอินแล้ว กำลังดึงโปรไฟล์...');
      return liff.getProfile();
    }).then(function (p) {
      if (!p) return;
      profile = p;
      document.getElementById('avatar').src = profile.pictureUrl || '';
      document.getElementById('empName').textContent = profile.displayName || '-';
      showScreen('mainScreen');
    }).catch(function (err) {
      clearTimeout(stallTimer);
      const msg = err && err.message ? err.message : String(err);
      if (isTokenExpiredError(msg)) {
        setStatus('เซสชันหมดอายุ กำลังเข้าสู่ระบบใหม่ให้อัตโนมัติ...');
        try { liff.logout(); } catch (e2) {}
        window.location.reload();
        return;
      }
      showError('เชื่อมต่อ LINE ไม่สำเร็จ: ' + msg);
    });
  }

  document.getElementById('dayTypeRow').addEventListener('click', function (e) {
    const opt = e.target.closest('.day-type-opt');
    if (!opt) return;
    document.querySelectorAll('.day-type-opt').forEach(function (el) { el.classList.remove('active'); });
    opt.classList.add('active');
    dayType = opt.dataset.type;
    document.getElementById('timeRangeRow').classList.toggle('show', dayType === 'range');
  });

  function showBanner(type, msg) {
    document.getElementById('resultBanner').innerHTML = '<div class="banner ' + type + '">' + msg + '</div>';
  }

  document.getElementById('submitBtn').addEventListener('click', function () {
    const banner = document.getElementById('resultBanner');
    banner.innerHTML = '';

    const remark = document.getElementById('remark').value.trim();
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;

    if (!remark) return showBanner('error', 'กรุณาระบุสถานที่หรือรายละเอียดการปฏิบัติงานนอกสถานที่');
    if (dayType === 'range' && (!startTime || !endTime)) return showBanner('error', 'กรุณาระบุช่วงเวลาให้ครบถ้วน');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังส่งรายงาน...';

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitOffsiteReport',
        payload: {
          lineUserId: profile.userId,
          aid: aid,
          dayType: dayType,
          startTime: startTime,
          endTime: endTime,
          remark: remark
        }
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (res.success) {
          document.getElementById('doneMessage').textContent = res.message || 'ส่งรายงานเรียบร้อยแล้วค่ะ';
          showScreen('doneScreen');
        } else {
          btn.disabled = false;
          btn.textContent = 'ส่งรายงาน';
          showBanner('error', res.message || 'ส่งรายงานไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ');
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'ส่งรายงาน';
        showBanner('error', 'ส่งรายงานไม่สำเร็จ: ' + err);
      });
  });

  init();
</script>
</body>
</html>
